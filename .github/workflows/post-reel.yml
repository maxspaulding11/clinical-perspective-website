# Post the day's Reel to Instagram.
#
# This runs on GitHub's machines rather than anyone's laptop for one reason:
# Meta's API has no scheduling. There is no scheduled_publish_time for
# Instagram the way there is for a Facebook Page -- /media_publish posts the
# moment it is called -- so something has to be awake at the posting time.
#
# A day with nothing queued is not a failure. scripts/ig_publish.py exits 0
# and says so, because a batch running out is normal and a red cross every
# morning would train everyone to ignore the one that matters.
name: Post the day's Reel

on:
  # The daily schedule is OFF, and this is why.
  #
  # Meta blocked the developer account on 5 October, it was cleared on the
  # 6th, Post88 published on the 8th, and it was blocked again on the 9th --
  # "we've noticed unusual activity on this developer account", on an account
  # whose entire activity is one Reel a day to its own Instagram. Every run
  # since has failed in ten seconds at the token check, and three days were
  # missed before anyone looked.
  #
  # A workflow that goes red every morning is worse than one that does not
  # run: it trains everyone to ignore the red, and it will be ignored on the
  # morning something else breaks. So posting moved to Meta Business Suite,
  # scheduled by hand from the pack scripts/schedule_pack.py writes, which
  # needs no developer account and ran batch 5 for weeks without complaint.
  #
  # BEFORE re-enabling: the media repo is stale. Post88-129 were moved eight
  # days later on 15 October (nothing had posted since Post87 on the 7th), and
  # the date is part of each file's name, so every videoUrl and coverUrl in
  # data/reels.json now 404s against tcp-reel-media. Nothing uses those URLs
  # today -- Business Suite uploads the local file -- so they were left alone
  # rather than pushing 64MB of renamed duplicates into a repo whose history
  # is already 77MB. Run scripts/ig_sync_media.py --prune first and check one
  # URL actually resolves; ig_publish.py cannot fetch what is not served, and
  # check_upcoming.py reports exactly this as "not served" every time it runs.
  #
  # Nothing here is deleted. If Meta ever leaves the account alone, put the
  # two cron lines back and it resumes:
  #     - cron: "0 10 * * *"   # 06:00 Eastern in summer
  #     - cron: "0 11 * * *"   # 06:00 Eastern in winter
  # ig_publish.py --only-at-hour 6 discards whichever one is wrong.
  workflow_dispatch:
    # So a missed day can be posted by hand, and so the first live run is a
    # deliberate button press rather than a wait until tomorrow.
    inputs:
      day:
        description: "Day to post (YYYY-MM-DD). Blank = today."
        required: false
      live:
        description: "Actually post. Unchecked = dry run."
        type: boolean
        default: false

# The token is only ever read, and only by the publish step.
permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Runs first so a broken token is reported as a broken token, rather
      # than as a failed post at nine in the morning. It prints the token's
      # type, whether it expires, its permissions and which Instagram account
      # it reaches -- and never the token itself, so this log is safe to read
      # and safe to paste.
      - name: Check the token
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python scripts/ig_check.py

      - name: Publish
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          python scripts/ig_publish.py \
            ${{ inputs.day && format('--day {0}', inputs.day) || '' }} \
            ${{ github.event_name == 'schedule' && '--only-at-hour 6' || '' }} \
            ${{ (github.event_name == 'schedule' || inputs.live) && '--live' || '' }}

      # Looks a week ahead, after today's post has already gone out. A missing
      # Reel is otherwise invisible until the morning it is due -- the first
      # unattended build left eleven unrendered and reported success, and the
      # first symptom would have been a failed post weeks later.
      #
      # always(), so a publish failure cannot hide a gap coming up behind it.
      # A red run here means next week needs attention, not that today broke.
      - name: Check the week ahead
        if: always()
        run: python scripts/check_upcoming.py --days 7
