# Post the day's Reel to Instagram.
#
# This runs on GitHub's machines rather than anyone's laptop for one reason:
# Meta's API has no scheduling. There is no scheduled_publish_time for
# Instagram the way there is for a Facebook Page -- /media_publish posts the
# moment it is called -- so something has to be awake at the posting time.
#
# A day with nothing queued is not a failure. scripts/ig_publish.py exits 0
# and says so, because a batch running out is normal and a red cross every
# morning would train everyone to ignore the one that matters.
name: Post the day's Reel

on:
  schedule:
    # 06:00 America/New_York, to match the Business Suite calendar batch 5 is
    # scheduled on.
    #
    # Two lines, not one. GitHub's cron is UTC and ignores daylight saving, so
    # 10:00 UTC is 06:00 Eastern in summer and 05:00 in winter -- and batch 7
    # runs straight through the 1 November changeover. Both candidate hours
    # fire and scripts/ig_publish.py discards the one that is not 06:00 local,
    # which costs a few seconds of runner time a day and keeps the post at six
    # o'clock year-round.
    - cron: "0 10 * * *"
    - cron: "0 11 * * *"
  workflow_dispatch:
    # So a missed day can be posted by hand, and so the first live run is a
    # deliberate button press rather than a wait until tomorrow.
    inputs:
      day:
        description: "Day to post (YYYY-MM-DD). Blank = today."
        required: false
      live:
        description: "Actually post. Unchecked = dry run."
        type: boolean
        default: false

# The token is only ever read, and only by the publish step.
permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Runs first so a broken token is reported as a broken token, rather
      # than as a failed post at nine in the morning. It prints the token's
      # type, whether it expires, its permissions and which Instagram account
      # it reaches -- and never the token itself, so this log is safe to read
      # and safe to paste.
      - name: Check the token
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python scripts/ig_check.py

      - name: Publish
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          python scripts/ig_publish.py \
            ${{ inputs.day && format('--day {0}', inputs.day) || '' }} \
            ${{ github.event_name == 'schedule' && '--only-at-hour 6' || '' }} \
            ${{ (github.event_name == 'schedule' || inputs.live) && '--live' || '' }}

      # Looks a week ahead, after today's post has already gone out. A missing
      # Reel is otherwise invisible until the morning it is due -- the first
      # unattended build left eleven unrendered and reported success, and the
      # first symptom would have been a failed post weeks later.
      #
      # always(), so a publish failure cannot hide a gap coming up behind it.
      # A red run here means next week needs attention, not that today broke.
      - name: Check the week ahead
        if: always()
        run: python scripts/check_upcoming.py --days 7
